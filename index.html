<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación Academia Inelro · Ibaceta</title>
<meta name="description" content="Evaluación de la capacitación Inelro para el equipo de ventas de Ibaceta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap">

<style>
:root {
  --azul: #00548A;
  --azul-hover: #00426D;
  --azul-tenue: #E7F0F6;
  --naranja: #F1891B;
  --naranja-tenue: #FDF0DF;
  --ok: #1B7A4B;
  --ok-tenue: #E4F2EA;
  --mal: #B03A2E;
  --mal-tenue: #F8E9E7;
  --fondo: #F2F5F8;
  --superficie: #FFFFFF;
  --superficie-2: #F8FAFC;
  --borde: #DCE4EC;
  --borde-fuerte: #C3CFDB;
  --texto: #26303A;
  --texto-tenue: #5F6E7D;
  --sombra: 0 1px 2px rgba(17,38,56,.06), 0 6px 16px rgba(17,38,56,.06);
  --radio: 10px;
  --titular: 'Montserrat', 'Gotham', system-ui, sans-serif;
  --cuerpo: 'Open Sans', 'Encode Sans', system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --azul: #4E9FD1; --azul-hover: #6FB3DD; --azul-tenue: #14293A;
    --naranja: #F59B3C; --naranja-tenue: #33230F;
    --ok: #4FBF86; --ok-tenue: #10301F;
    --mal: #E27B6E; --mal-tenue: #331A16;
    --fondo: #0D1620; --superficie: #16202C; --superficie-2: #1B2734;
    --borde: #2A3846; --borde-fuerte: #3B4C5D;
    --texto: #E2E9F0; --texto-tenue: #9BAAB9;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --azul: #4E9FD1; --azul-hover: #6FB3DD; --azul-tenue: #14293A;
  --naranja: #F59B3C; --naranja-tenue: #33230F;
  --ok: #4FBF86; --ok-tenue: #10301F;
  --mal: #E27B6E; --mal-tenue: #331A16;
  --fondo: #0D1620; --superficie: #16202C; --superficie-2: #1B2734;
  --borde: #2A3846; --borde-fuerte: #3B4C5D;
  --texto: #E2E9F0; --texto-tenue: #9BAAB9;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
body {
  background: var(--fondo); color: var(--texto);
  font-family: var(--cuerpo); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.envoltorio { max-width: 760px; margin: 0 auto; padding: 0 20px 64px; }

.marca { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 26px 0 12px; border-bottom: 3px solid var(--naranja); }
.marca h1 { font-family: var(--titular); font-weight: 800; font-size: 26px;
  letter-spacing: .04em; color: var(--azul); margin: 0; }
.marca .sub { color: var(--texto-tenue); font-size: 13px; }

.encabezado { margin: 26px 0 20px; }
.encabezado h2 { font-family: var(--titular); font-weight: 700; font-size: 24px;
  margin: 0 0 6px; text-wrap: balance; line-height: 1.25; }
.encabezado p { margin: 0; color: var(--texto-tenue); max-width: 60ch; }

.tarjeta { background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio); padding: 22px; box-shadow: var(--sombra); }
.reglas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
  background: var(--borde); border: 1px solid var(--borde); border-radius: var(--radio);
  overflow: hidden; margin: 18px 0 24px; }
.regla { background: var(--superficie); padding: 14px 16px; }
.regla .n { font-family: var(--titular); font-weight: 800; font-size: 22px; color: var(--azul);
  font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.regla .q { font-size: 12.5px; color: var(--texto-tenue); }

label.campo { display: block; margin-bottom: 16px; }
label.campo .et { display: block; font-family: var(--titular); font-weight: 600; font-size: 11.5px;
  letter-spacing: .09em; text-transform: uppercase; color: var(--texto-tenue); margin-bottom: 6px; }
input[type="text"], select { width: 100%; padding: 11px 12px; font: inherit; color: var(--texto);
  background: var(--superficie-2); border: 1px solid var(--borde-fuerte); border-radius: 8px; appearance: none; }
input[type="text"]:focus, select:focus { outline: 2px solid var(--azul); outline-offset: 1px; border-color: var(--azul); }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 520px) { .dos { grid-template-columns: 1fr; } }

button { font-family: var(--titular); font-weight: 700; font-size: 14px; padding: 12px 22px;
  border-radius: 8px; border: 1px solid transparent; cursor: pointer;
  transition: background .15s ease, color .15s ease; }
button:focus-visible { outline: 2px solid var(--naranja); outline-offset: 2px; }
.btn-primario { background: var(--azul); color: #fff; }
.btn-primario:hover:not(:disabled) { background: var(--azul-hover); }
.btn-primario:disabled { background: var(--borde-fuerte); color: var(--texto-tenue); cursor: not-allowed; }
.btn-suave { background: transparent; color: var(--azul); border-color: var(--borde-fuerte); }
.btn-suave:hover { background: var(--azul-tenue); }

.progreso { position: sticky; top: 0; z-index: 5; background: var(--fondo);
  padding: 12px 0 10px; margin-bottom: 4px; border-bottom: 1px solid var(--borde); }
.progreso .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 7px; }
.progreso .txt { font-family: var(--titular); font-weight: 600; font-size: 12px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--texto-tenue); }
.progreso .cont { font-variant-numeric: tabular-nums; color: var(--azul); font-weight: 700; }
.barra { height: 6px; background: var(--borde); border-radius: 99px; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--naranja); width: 0; transition: width .3s ease; }

.pregunta { border-top: 1px solid var(--borde); padding: 22px 0 6px; }
.pregunta:first-of-type { border-top: 0; }
.pregunta .tema { font-family: var(--titular); font-weight: 700; font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--naranja); margin-bottom: 7px; }
.pregunta .enunciado { font-family: var(--titular); font-weight: 600; font-size: 16.5px; line-height: 1.4;
  margin: 0 0 14px; text-wrap: balance; }
.pregunta .enunciado .num { color: var(--texto-tenue); font-variant-numeric: tabular-nums; margin-right: 7px; }
.opciones { display: flex; flex-direction: column; gap: 8px; }
.opcion { display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px;
  background: var(--superficie); border: 1px solid var(--borde); border-radius: 8px; cursor: pointer;
  transition: border-color .15s ease, background .15s ease; }
.opcion:hover { border-color: var(--azul); }
.opcion input { margin: 3px 0 0; accent-color: var(--azul); flex: none; }
.opcion.marcada { border-color: var(--azul); background: var(--azul-tenue); }
.opcion .letra { font-family: var(--titular); font-weight: 700; color: var(--texto-tenue); flex: none; min-width: 15px; }
.opcion.marcada .letra { color: var(--azul); }

.pie-examen { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--borde); }
.pie-examen .aviso { color: var(--texto-tenue); font-size: 13px; }

.nota-caja { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.nota-num { font-family: var(--titular); font-weight: 800; font-size: 62px; line-height: .95;
  font-variant-numeric: tabular-nums; }
.nota-num small { font-size: 22px; font-weight: 600; color: var(--texto-tenue); }
.sello { display: inline-block; font-family: var(--titular); font-weight: 700; font-size: 12px;
  letter-spacing: .1em; text-transform: uppercase; padding: 5px 12px; border-radius: 99px; }
.sello.si { background: var(--ok-tenue); color: var(--ok); }
.sello.no { background: var(--mal-tenue); color: var(--mal); }

.escala { margin: 22px 0 4px; }
.escala .via { position: relative; height: 26px; }
.escala .riel { position: absolute; top: 10px; left: 0; right: 0; height: 7px; background: var(--borde); border-radius: 99px; }
.escala .lleno { position: absolute; top: 10px; left: 0; height: 7px; border-radius: 99px; }
.escala .corte { position: absolute; top: 3px; width: 2px; height: 21px; background: var(--texto); opacity: .55; }
.escala .marcas { display: flex; justify-content: space-between; font-size: 11px;
  color: var(--texto-tenue); font-variant-numeric: tabular-nums; margin-top: 2px; }
.escala .pie-corte { font-size: 11.5px; color: var(--texto-tenue); margin-top: 6px; }

.repaso { margin-top: 26px; }
.repaso h3 { font-family: var(--titular); font-size: 15px; margin: 0 0 4px; }
.repaso p.intro { margin: 0 0 14px; color: var(--texto-tenue); font-size: 14px; }
.linea-tema { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px;
  border-left: 3px solid var(--mal); background: var(--superficie-2);
  border-radius: 0 8px 8px 0; margin-bottom: 8px; }
.linea-tema.bien { border-left-color: var(--ok); }
.linea-tema .marca-r { font-family: var(--titular); font-weight: 700; flex: none; }
.linea-tema .marca-r.mal { color: var(--mal); }
.linea-tema .marca-r.bien { color: var(--ok); }
.linea-tema .cuerpo-r { min-width: 0; }
.linea-tema .t { font-family: var(--titular); font-weight: 600; font-size: 14px; }
.linea-tema .d { font-size: 13.5px; color: var(--texto-tenue); }
.linea-tema .d b { color: var(--texto); font-weight: 600; }

.nota-pie { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--borde);
  color: var(--texto-tenue); font-size: 13px; }
.aviso-caja { background: var(--naranja-tenue); border: 1px solid var(--naranja);
  border-radius: 8px; padding: 12px 15px; font-size: 13.5px; margin-bottom: 20px; }
.aviso-caja.error { background: var(--mal-tenue); border-color: var(--mal); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 560px) { .nota-num { font-size: 50px; } .encabezado h2 { font-size: 21px; } }
</style>
</head>
<body>

<div class="envoltorio">
  <header class="marca">
    <h1>IBACETA</h1>
    <span class="sub">Academia Inelro · Evaluación de formación de ventas</span>
  </header>
  <main id="app"></main>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     PEGAR ACA la URL de la aplicación web de Apps Script.
     Se saca en: Google Sheet > Extensiones > Apps Script > Implementar >
     Nueva implementación > Aplicación web. Termina en /exec
     ------------------------------------------------------------------ */
  var URL_REGISTRO = "https://script.google.com/macros/s/AKfycbzFkTe21BvJj0NAf203f68cmaCK_AGAxhoHcalAHaji7ckiDMrIx-9OSiEZBLplAIrG/exec";

  var PREGUNTAS = [
    { tema: "La marca", pag: 4,
      q: "¿Qué lugar ocupa Inelro en el mercado argentino de refrigeración?",
      ops: [
        { t: "Fue la primera empresa de refrigeración del país en ofrecer su línea de Freezers Hogar con Certificación Energética A++", ok: true },
        { t: "Es la única empresa argentina que fabrica sus propios compresores", ok: false },
        { t: "Fue la primera en incorporar gas R134a a sus equipos", ok: false }],
      repaso: "Inelro fue la primera empresa de refrigeración en Argentina con Certificación Energética A++ en Freezers Hogar." },
    { tema: "Garantía", pag: 31,
      q: "Un cliente pregunta por la garantía. ¿Cuál es la diferencia entre un equipo Inverter y uno con compresor on-off?",
      ops: [
        { t: "Inverter: 5 años de compresor y 2 del módulo electrónico. On-off: 2 años de compresor", ok: true },
        { t: "Los dos tienen 2 años de compresor; la diferencia es solo el consumo", ok: false },
        { t: "Inverter: 3 años de compresor. On-off: 5 años", ok: false }],
      repaso: "Inverter: 5 años de compresor + 2 años del módulo electrónico. On-off: 2 años de compresor." },
    { tema: "Tecnología Inverter", pag: 24,
      q: "¿Cómo trabaja un compresor Inverter frente a uno on-off?",
      ops: [
        { t: "Varía su rotación según la demanda: la sube cuando aumenta la temperatura y la reduce al alcanzar la deseada", ok: true },
        { t: "Gira siempre a la misma velocidad y se apaga cuando llega a la temperatura", ok: false },
        { t: "Alterna encendido y apagado cada 15 minutos de forma programada", ok: false }],
      repaso: "El Inverter es de rotación variable: acompaña la demanda. El on-off arranca a full y para." },
    { tema: "Beneficios Inverter", pag: 25,
      q: "¿Qué ahorro y qué reducción de ruido tiene el compresor Inverter?",
      ops: [
        { t: "Hasta 15-30% más de economía y hasta 5 dB(A) más silencioso", ok: true },
        { t: "Hasta 50% de economía y 15 dB(A) más silencioso", ok: false },
        { t: "Hasta 5% de economía; el nivel de ruido es el mismo", ok: false }],
      repaso: "Hasta 15-30% más de economía y hasta 5 dB(A) más silencioso. No prometer más que eso." },
    { tema: "Banda de voltaje", pag: 26,
      q: "En la línea comercial, ¿entre qué tensiones trabaja un compresor Inverter Bivolt?",
      ops: [
        { t: "Entre 90 V y 264 V, mientras que un compresor convencional trabaja entre 198 V y 242 V", ok: true },
        { t: "Entre 198 V y 242 V, igual que un compresor convencional", ok: false },
        { t: "Únicamente a 220 V, y necesita estabilizador", ok: false }],
      repaso: "Inverter Bivolt de la línea comercial: 90 V a 264 V. Convencional: 198 V a 242 V." },
    { tema: "Refrigerantes", pag: 20,
      q: "¿Qué refrigerante usa cada línea y por qué es una ventaja?",
      ops: [
        { t: "R290 en exhibidoras y R600a en freezers hogar: son naturales y tienen un GWP muy bajo (3,3 y 20) frente a 3.920 del R404A", ok: true },
        { t: "R404A en todas las líneas, porque enfría más rápido", ok: false },
        { t: "R134a en exhibidoras y R22 en freezers, porque son más económicos", ok: false }],
      repaso: "R290 en exhibidoras, R600a en freezers hogar. GWP 3,3 y 20 contra 3.920 del R404A." },
    { tema: "Freezers", pag: 15,
      q: "¿Cuáles son las cuatro funciones de temperatura de los freezers Inelro?",
      ops: [
        { t: "Enfriador 0 a 4 °C, Conservadora -10 a -15 °C, Freezer -18 a -20 °C y Frío Extremo -20 a -25 °C", ok: true },
        { t: "Solo dos: Freezer y Frío Extremo", ok: false },
        { t: "Enfriador 10 a 15 °C, Conservadora 0 a -5 °C y Freezer -10 °C", ok: false }],
      repaso: "Enfriador 0/4 °C · Conservadora -10/-15 °C · Freezer -18/-20 °C · Frío Extremo -20/-25 °C." },
    { tema: "Instalación", pag: 8,
      q: "Al instalar una exhibidora vertical, ¿qué hay que hacer antes de cargarla con mercadería?",
      ops: [
        { t: "Dejarla funcionando dos horas e ir cargándola de a poco", ok: true },
        { t: "Cargarla completa apenas se enchufa, para que el frío se distribuya", ok: false },
        { t: "Dejarla 24 horas apagada y recién después cargarla llena", ok: false }],
      repaso: "Dos horas en funcionamiento antes de cargar, y cargar de a poco. Además: inclinada hacia atrás y lejos del sol." },
    { tema: "Uso diario", pag: 9,
      q: "Si hay que desconectar el equipo y volver a conectarlo, ¿cuánto hay que esperar?",
      ops: [
        { t: "5 minutos, para que se estabilicen los gases", ok: true },
        { t: "30 segundos, el tiempo que tarda el controlador en reiniciar", ok: false },
        { t: "Una hora, hasta que el evaporador se descongele", ok: false }],
      repaso: "5 minutos entre desconectar y volver a conectar, para que se estabilicen los gases." },
    { tema: "Limpieza", pag: 11,
      q: "¿Cómo se limpia el interior de una exhibidora?",
      ops: [
        { t: "Desconectando la unidad y con un paño húmedo; nunca con chorros de agua, hidrolavadora, solventes, agua caliente ni elementos punzocortantes", ok: true },
        { t: "Con manguera y agua caliente, para desinfectar mejor", ok: false },
        { t: "Con hidrolavadora a baja presión y detergente", ok: false }],
      repaso: "Desconectar y limpiar con paño húmedo. Nunca hidrolavadora, manguera, solventes, agua caliente ni punzocortantes." }
  ];

  var SUCURSALES = ["Videla Castillo", "Alameda", "San Juan", "San Luis", "San Martín",
    "San Rafael", "Villa Mercedes", "Villa Krause", "Río Cuarto", "Maipú",
    "CABA", "Multiespacio", "Calle / venta externa", "Otra"];

  var TOTAL = PREGUNTAS.length, APRUEBA = 7, MAX_INTENTOS = 3;
  var app = document.getElementById("app");
  var persona = null, examen = null, ultimoGuardado = false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function hoy() {
    return new Date().toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }
  function clave(dni) { return "eval-inelro-" + String(dni).trim(); }
  function leerLocal(dni) {
    try { var x = localStorage.getItem(clave(dni)); return x ? JSON.parse(x) : null; }
    catch (e) { return null; }
  }
  function guardarLocal(dni, d) {
    try { localStorage.setItem(clave(dni), JSON.stringify(d)); } catch (e) { /* modo privado */ }
  }

  /* Se manda como text/plain a propósito: así el navegador no dispara el
     preflight de CORS, que Apps Script no responde. */
  async function llamar(cuerpo) {
    if (!URL_REGISTRO) return null;
    var r = await fetch(URL_REGISTRO, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(cuerpo)
    });
    return await r.json();
  }

  async function consultarIntentos(dni) {
    try {
      var r = await llamar({ accion: "consultar", dni: dni });
      if (r && r.ok) return { intentos: r.intentos, aprobado: r.aprobado, mejorNota: r.mejorNota };
    } catch (e) { /* sin conexión: se usa lo local */ }
    return leerLocal(dni) || { intentos: 0, aprobado: false, mejorNota: 0 };
  }

  // ------------------------------------------------------------ pantallas
  function pantallaInicio(msg) {
    app.innerHTML =
      '<div class="encabezado">' +
        "<h2>Evaluación de la capacitación Inelro</h2>" +
        "<p>Diez preguntas sobre la formación de ventas de octubre 2024: tecnología Inverter, " +
        "garantías, refrigerantes, instalación y mantenimiento.</p></div>" +
      '<div class="reglas">' +
        '<div class="regla"><span class="n">10</span><span class="q">preguntas, 1 punto cada una</span></div>' +
        '<div class="regla"><span class="n">7</span><span class="q">nota mínima para aprobar</span></div>' +
        '<div class="regla"><span class="n">3</span><span class="q">intentos como máximo</span></div>' +
      "</div>" +
      (msg || "") +
      '<div class="tarjeta">' +
        '<label class="campo"><span class="et">Nombre y apellido</span>' +
          '<input type="text" id="f-nombre" autocomplete="name" placeholder="Como figura en el legajo"></label>' +
        '<div class="dos">' +
          '<label class="campo"><span class="et">DNI</span>' +
            '<input type="text" id="f-dni" inputmode="numeric" autocomplete="off" placeholder="Sin puntos"></label>' +
          '<label class="campo"><span class="et">Sucursal</span><select id="f-sucursal">' +
            '<option value="">Elegí tu sucursal</option>' +
            SUCURSALES.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + "</option>"; }).join("") +
          "</select></label>" +
        "</div>" +
        '<button class="btn-primario" id="b-empezar" disabled>Comenzar la evaluación</button>' +
        '<p class="nota-pie" style="border:0;padding:0;margin-top:14px;">' +
          "El DNI se usa para registrar tu resultado y contar tus intentos. " +
          "Una vez que empieces, respondé las diez preguntas y entregá.</p>" +
      "</div>";

    var nom = document.getElementById("f-nombre");
    var dni = document.getElementById("f-dni");
    var suc = document.getElementById("f-sucursal");
    var btn = document.getElementById("b-empezar");
    function revisar() {
      btn.disabled = !(nom.value.trim().length > 2 && dni.value.replace(/\D/g, "").length >= 7 && suc.value);
    }
    [nom, dni].forEach(function (el) { el.addEventListener("input", revisar); });
    suc.addEventListener("change", revisar);
    revisar();

    btn.addEventListener("click", async function () {
      btn.disabled = true;
      btn.textContent = "Verificando…";
      var d = dni.value.replace(/\D/g, "");
      var previo = await consultarIntentos(d);
      persona = { nombre: nom.value.trim(), dni: d, sucursal: suc.value,
                  intentos: previo.intentos, mejorNota: previo.mejorNota, aprobado: previo.aprobado };
      guardarLocal(d, previo);

      if (previo.aprobado) { pantallaYaAprobo(); return; }
      if (previo.intentos >= MAX_INTENTOS) { pantallaBloqueado(); return; }
      arrancarExamen();
    });
  }

  function pantallaYaAprobo() {
    app.innerHTML =
      '<div class="encabezado"><h2>Ya aprobaste la evaluación</h2>' +
      "<p>" + esc(persona.nombre) + " · " + esc(persona.sucursal) + "</p></div>" +
      '<div class="tarjeta"><div class="nota-caja">' +
        '<div class="nota-num" style="color:var(--ok)">' + persona.mejorNota + "<small>/10</small></div>" +
        '<div><span class="sello si">Aprobada</span>' +
        '<p style="margin:10px 0 0;color:var(--texto-tenue);font-size:13.5px;">' +
        "Tu resultado ya quedó registrado. No hace falta que vuelvas a rendir.</p></div>" +
      "</div></div>";
  }

  function pantallaBloqueado() {
    app.innerHTML =
      '<div class="encabezado"><h2>Usaste los tres intentos</h2>' +
      "<p>Tu mejor nota fue " + persona.mejorNota + "/10 y el mínimo para aprobar es " + APRUEBA + ". " +
      "Hablá con tu responsable de sucursal para repasar el material y habilitar una nueva instancia.</p></div>" +
      '<div class="tarjeta"><div class="nota-caja">' +
        '<div class="nota-num" style="color:var(--mal)">' + persona.mejorNota + "<small>/10</small></div>" +
        '<div><span class="sello no">No aprobada</span>' +
        '<p style="margin:10px 0 0;color:var(--texto-tenue);font-size:13.5px;">' +
        esc(persona.nombre) + " · " + esc(persona.sucursal) + "</p></div>" +
      "</div></div>";
  }

  function arrancarExamen() {
    examen = {
      items: barajar(PREGUNTAS).map(function (p) { return { p: p, ops: barajar(p.ops), elegida: null }; }),
      inicio: Date.now()
    };
    pantallaExamen();
    window.scrollTo(0, 0);
  }

  function pantallaExamen() {
    var letras = ["a", "b", "c", "d"];
    app.innerHTML =
      '<div class="progreso"><div class="fila">' +
        '<span class="txt">Intento ' + (persona.intentos + 1) + " de " + MAX_INTENTOS + "</span>" +
        '<span class="txt cont"><span id="p-hechas">0</span> de ' + TOTAL + " respondidas</span></div>" +
        '<div class="barra"><i id="p-barra"></i></div></div>' +
      examen.items.map(function (it, i) {
        return '<section class="pregunta"><div class="tema">' + esc(it.p.tema) + "</div>" +
          '<h3 class="enunciado"><span class="num">' + (i + 1) + ".</span>" + esc(it.p.q) + "</h3>" +
          '<div class="opciones">' +
            it.ops.map(function (o, j) {
              return '<label class="opcion" data-i="' + i + '" data-j="' + j + '">' +
                '<input type="radio" name="q' + i + '" value="' + j + '">' +
                '<span class="letra">' + letras[j] + ")</span><span>" + esc(o.t) + "</span></label>";
            }).join("") +
          "</div></section>";
      }).join("") +
      '<div class="pie-examen">' +
        '<button class="btn-primario" id="b-entregar" disabled>Entregar evaluación</button>' +
        '<span class="aviso" id="a-faltan">Faltan ' + TOTAL + " respuestas</span></div>";

    app.addEventListener("change", function (ev) {
      var t = ev.target;
      if (!t || t.type !== "radio") return;
      var lab = t.closest(".opcion");
      var i = +lab.dataset.i;
      examen.items[i].elegida = +lab.dataset.j;
      Array.prototype.forEach.call(app.querySelectorAll('.opcion[data-i="' + i + '"]'),
        function (el) { el.classList.toggle("marcada", el === lab); });
      actualizarProgreso();
    });
    document.getElementById("b-entregar").addEventListener("click", entregar);
  }

  function actualizarProgreso() {
    var hechas = examen.items.filter(function (it) { return it.elegida !== null; }).length;
    document.getElementById("p-hechas").textContent = hechas;
    document.getElementById("p-barra").style.width = (hechas / TOTAL * 100) + "%";
    var faltan = TOTAL - hechas;
    document.getElementById("b-entregar").disabled = faltan > 0;
    document.getElementById("a-faltan").textContent = faltan === 0
      ? "Ya podés entregar"
      : "Falta" + (faltan === 1 ? " 1 respuesta" : "n " + faltan + " respuestas");
  }

  async function entregar() {
    var btn = document.getElementById("b-entregar");
    btn.disabled = true;
    btn.textContent = "Enviando…";

    var detalle = examen.items.map(function (it) {
      return { tema: it.p.tema, pag: it.p.pag, repaso: it.p.repaso,
               bien: it.elegida !== null && it.ops[it.elegida].ok };
    });
    var nota = detalle.filter(function (d) { return d.bien; }).length;
    var aprobado = nota >= APRUEBA;
    var minutos = Math.max(1, Math.round((Date.now() - examen.inicio) / 60000));
    var fallos = detalle.filter(function (d) { return !d.bien; })
      .map(function (d) { return d.tema; }).join(", ");

    persona.intentos += 1;
    if (nota > persona.mejorNota) persona.mejorNota = nota;
    if (aprobado) persona.aprobado = true;
    guardarLocal(persona.dni, { intentos: persona.intentos, mejorNota: persona.mejorNota, aprobado: persona.aprobado });

    ultimoGuardado = false;
    try {
      var r = await llamar({ accion: "registrar", nombre: persona.nombre, dni: persona.dni,
        sucursal: persona.sucursal, nota: nota, aprobado: aprobado, minutos: minutos,
        fallos: fallos || "—" });
      ultimoGuardado = !!(r && r.ok);
    } catch (e) { ultimoGuardado = false; }

    pantallaResultado(nota, aprobado, detalle);
    window.scrollTo(0, 0);
  }

  function pantallaResultado(nota, aprobado, detalle) {
    var restantes = MAX_INTENTOS - persona.intentos;
    var color = aprobado ? "var(--ok)" : "var(--mal)";
    var errores = detalle.filter(function (d) { return !d.bien; });
    var repasoHtml;

    if (aprobado) {
      repasoHtml = "<h3>Repaso de las diez</h3>" +
        '<p class="intro">Guardá esto: es lo que hay que poder decir en el salón.</p>' +
        detalle.map(function (d) {
          return '<div class="linea-tema' + (d.bien ? " bien" : "") + '">' +
            '<span class="marca-r ' + (d.bien ? "bien" : "mal") + '">' + (d.bien ? "✓" : "✗") + "</span>" +
            '<div class="cuerpo-r"><div class="t">' + esc(d.tema) + '</div>' +
            '<div class="d">' + esc(d.repaso) + "</div></div></div>";
        }).join("");
    } else if (errores.length) {
      repasoHtml = "<h3>Qué repasar antes del próximo intento</h3>" +
        '<p class="intro">Estos son los temas que fallaste. Volvé a la presentación de la ' +
        "Academia Inelro, en las páginas indicadas, antes de volver a rendir.</p>" +
        errores.map(function (d) {
          return '<div class="linea-tema"><span class="marca-r mal">✗</span>' +
            '<div class="cuerpo-r"><div class="t">' + esc(d.tema) + "</div>" +
            '<div class="d">Página <b>' + d.pag + "</b> del material</div></div></div>";
        }).join("");
    } else { repasoHtml = ""; }

    var puedeReintentar = restantes > 0 && !aprobado;
    app.innerHTML =
      '<div class="encabezado"><h2>' + (aprobado ? "Aprobaste la evaluación" : "No alcanzaste el mínimo") + "</h2>" +
        "<p>" + esc(persona.nombre) + " · " + esc(persona.sucursal) + " · " + hoy() +
        " · intento " + persona.intentos + " de " + MAX_INTENTOS + "</p></div>" +
      '<div class="tarjeta"><div class="nota-caja">' +
          '<div class="nota-num" style="color:' + color + '">' + nota + "<small>/10</small></div>" +
          '<div><span class="sello ' + (aprobado ? "si" : "no") + '">' +
            (aprobado ? "Aprobada" : "No aprobada") + "</span>" +
            '<p style="margin:10px 0 0;color:var(--texto-tenue);font-size:13.5px;max-width:34ch;">' +
            "Respondiste bien " + nota + " de 10" + (aprobado ? ". El mínimo era " : " y el mínimo es ") + APRUEBA + ".</p></div>" +
      "</div>" +
      '<div class="escala"><div class="via"><div class="riel"></div>' +
        '<div class="lleno" style="width:' + (nota / 10 * 100) + "%;background:" + color + ';"></div>' +
        '<div class="corte" style="left:calc(' + (APRUEBA / 10 * 100) + '% - 1px)"></div></div>' +
        '<div class="marcas"><span>0</span><span>5</span><span>10</span></div>' +
        '<div class="pie-corte">La marca vertical es el 7: la línea de corte.</div></div>' +
      '<div class="repaso">' + repasoHtml + "</div>" +
      '<div class="nota-pie">' +
        (aprobado ? "" : (restantes > 0
          ? "Te " + (restantes === 1 ? "queda 1 intento" : "quedan " + restantes + " intentos") + ". "
          : "Usaste los tres intentos. ")) +
        (ultimoGuardado
          ? "Tu resultado quedó registrado."
          : "<b>No pudimos registrar tu resultado.</b> Sacale una foto a esta pantalla y mandásela a tu responsable.") +
      "</div>" +
      (puedeReintentar
        ? '<div style="margin-top:16px;"><button class="btn-suave" id="b-otra">Intentar otra vez</button></div>'
        : "") +
      "</div>";

    var otra = document.getElementById("b-otra");
    if (otra) otra.addEventListener("click", function () {
      if (persona.intentos >= MAX_INTENTOS) { pantallaBloqueado(); return; }
      arrancarExamen();
    });
  }

  // --------------------------------------------------------------- inicio
  var aviso = "";
  if (!URL_REGISTRO) {
    aviso = '<div class="aviso-caja error"><b>Falta configurar el registro.</b> ' +
      "Todavía no se cargó la dirección de la planilla de resultados, así que las notas " +
      "no se van a guardar. Avisale a quien administra la evaluación antes de repartir el enlace.</div>";
  }
  pantallaInicio(aviso);
})();
</script>
</body>
</html>
